services:

  minio:
    # MinIO's public community image was withdrawn; SeaweedFS exposes the S3 API
    # this application uses without requiring a commercial AIStor license.
    image: chrislusf/seaweedfs:4.39
    restart: always
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY}
      S3_BUCKET: ${MINIO_BUCKET}
    ports:
      - "${MINIO_API_PORT:-9000}:8333"
      - "${MINIO_CONSOLE_PORT:-9001}:8888"
    volumes:
      - minio_data:/data

  centrifugo:
    image: centrifugo/centrifugo:v6
    restart: always
    command: centrifugo -c /centrifugo/config.json
    environment:
      CENTRIFUGO_CLIENT_TOKEN_HMAC_SECRET_KEY: ${CENTRIFUGO_TOKEN_SECRET}
      CENTRIFUGO_HTTP_API_KEY: ${CENTRIFUGO_API_KEY}
    ports:
      - "${CENTRIFUGO_PORT:-8000}:8000"
    volumes:
      - ./centrifugo:/centrifugo

  db:
    image: postgres:16-alpine
    restart: always
    shm_size: 128mb
    # Expose PostgreSQL to localhost for Prisma and local administration tools.
    # Port 5432 is already used by another local PostgreSQL container.
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: multimedia
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d multimedia"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    # Listens on port 3000 on every network interface of the PC, so other devices on the WiFi can reach it.
    ports:
      - "${APP_PORT:-3000}:3000"
    env_file:
      - .env # MinIO, Centrifugo, and other service keys. DATABASE_URL is overridden below.
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: postgresql://postgres:postgres@db:5432/multimedia
      MINIO_ENDPOINT: http://minio:8333
      CENTRIFUGO_HTTP_URL: http://centrifugo:8000
      # Plain http://<LAN-IP> cannot store Secure cookies, so login would fail without this.
      COOKIE_SECURE: "false"
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
      centrifugo:
        condition: service_started

   # Use postgres/example user/password credentials

volumes:
  postgres_data:
  minio_data:

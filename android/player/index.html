<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>XOS Player</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#000;color:#fff;font:16px system-ui,sans-serif}#stage{border:0;width:100vw;height:100dvh;display:block}dialog{width:min(440px,calc(100vw - 32px));border:1px solid #ffffff30;border-radius:22px;padding:28px;background:#19151f;color:#fff}dialog::backdrop{background:#0009}h1{font-size:26px;margin:0 0 8px}p{color:#bdb6c9;line-height:1.5}label{display:block;font-size:14px;margin-top:18px}input{width:100%;margin-top:8px;padding:14px;border:1px solid #ffffff30;border-radius:10px;background:#ffffff08;color:white;font:inherit}button{padding:13px 18px;border:1px solid #ffffff30;border-radius:12px;background:#ffffff0a;color:white;font:inherit;cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid #b899ff}button:disabled{opacity:.5}.primary{background:#8d36dd;border:0}.buttons{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}#error{color:#ffb0b0}#message{position:fixed;inset:0;display:none;place-items:center;padding:36px;text-align:center;background:#09090b}#menu-button{position:fixed;right:12px;top:12px;opacity:.4;z-index:2;padding:8px 14px}#menu-button:hover,#menu-button:focus{opacity:1}
</style></head><body>
<iframe id="stage" title="Screen content" src="player.html?kind=layout"></iframe><div id="message" role="status"></div><button id="menu-button" aria-label="Player menu">⋮</button>
<dialog id="settings"><form id="connect-form"><h1>XOS Player</h1><p>Connect to your CMS screen.</p><label>Server URL<input id="server" placeholder="http://192.168.1.5:3000" inputmode="url" required></label><label>Screen ID<input id="screen" placeholder="Enter Screen ID" inputmode="numeric" required></label><p id="error" role="alert"></p><div class="buttons"><button class="primary" id="connect" type="submit">Connect</button><button type="button" id="cancel">Cancel</button></div></form></dialog>
<dialog id="actions"><h1>Player menu</h1><div class="buttons"><button id="edit">Connection settings</button><button id="reconnect">Reconnect</button><button id="resume">Resume playback</button><button id="quit">Exit player</button></div></dialog>
<script src="centrifuge.js"></script><script src="screen-connection.js"></script><script src="host.js"></script></body></html>
